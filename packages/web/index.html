<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diplomacy Board</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="board-pane" aria-label="Classic 1901 board">
        <header class="topbar">
          <div>
            <h1>Classic 1901</h1>
            <p id="phaseLabel"></p>
          </div>
          <div class="toolbar" aria-label="Map layers">
            <label class="toggle">
              <input id="labelsToggle" type="checkbox" checked>
              <span>Labels</span>
            </label>
          </div>
        </header>
        <div class="map-frame">
          <svg id="board" viewBox="0 0 1000 720" role="img" aria-labelledby="mapTitle">
            <title id="mapTitle">Classic Diplomacy starting board</title>
          </svg>
        </div>
      </section>
      <div
        id="paneResizer"
        class="pane-resizer"
        role="separator"
        aria-label="Resize order panel"
        aria-orientation="vertical"
        aria-controls="orderPanel"
        tabindex="0"
      ></div>
      <aside id="orderPanel" class="side-pane" aria-label="Board details">
        <section class="panel">
          <h2>Selected</h2>
          <div id="selection" class="selection"></div>
        </section>
        <section class="panel">
          <h2>Orders</h2>
          <div class="order-actions">
            <button id="submitOrders" class="primary-button" type="button">Submit Orders</button>
            <button id="resetGame" class="secondary-button" type="button">Reset</button>
          </div>
          <div id="orderList" class="order-list"></div>
        </section>
        <section class="panel">
          <h2>Results</h2>
          <div id="resultList" class="result-list"></div>
        </section>
        <section class="panel">
          <h2>Powers</h2>
          <div id="powerList" class="power-list"></div>
        </section>
        <p class="attribution">
          Map: <a href="https://commons.wikimedia.org/wiki/File:Diplomacy.svg">Diplomacy.svg</a> by Martin Asal and contributors, CC BY-SA 3.0.
        </p>
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
