<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diplomacy Board</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="board-pane" aria-label="Classic 1901 board">
        <header class="topbar">
          <div>
            <h1>Classic 1901</h1>
            <p id="phaseLabel"></p>
          </div>
          <div class="toolbar" aria-label="Board controls">
            <div class="settings-menu">
              <button
                id="settingsToggle"
                class="settings-button"
                type="button"
                aria-label="Open settings"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="settingsPanel"
              >
                Settings
              </button>
              <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings" hidden>
                <h2>Settings</h2>
                <section class="settings-group" aria-labelledby="cosmeticSettingsHeading">
                  <h3 id="cosmeticSettingsHeading">Cosmetic</h3>
                  <label class="settings-row">
                    <span>Coast shadow</span>
                    <input id="shadowToggle" type="checkbox" checked>
                  </label>
                  <label class="settings-row">
                    <span>Labels</span>
                    <input id="labelsToggle" type="checkbox" checked>
                  </label>
                  <label class="settings-row settings-row-select">
                    <span>Theme</span>
                    <select id="themeSelect">
                      <option value="light" selected>Light</option>
                      <option value="dark">Dark</option>
                    </select>
                  </label>
                </section>
                <section class="settings-group" aria-labelledby="gameSettingsHeading">
                  <h3 id="gameSettingsHeading">Game Rules</h3>
                  <label class="settings-row">
                    <span>Build in conquered SCs</span>
                    <input id="conqueredBuildsToggle" type="checkbox">
                  </label>
                  <label class="settings-row">
                    <span>Convert units in SCs</span>
                    <input id="scConversionsToggle" type="checkbox">
                  </label>
                </section>
              </div>
            </div>
          </div>
        </header>
        <div class="map-frame">
          <div class="map-view-controls" role="group" aria-label="Map zoom controls">
            <button id="zoomMapIn" class="map-view-button" type="button" aria-label="Zoom map in">+</button>
            <button id="zoomMapOut" class="map-view-button" type="button" aria-label="Zoom map out">-</button>
            <button id="resetMapView" class="map-view-button map-view-fit" type="button" aria-label="Fit map to frame" hidden>Fit</button>
          </div>
          <svg id="board" viewBox="0 0 1000 720" role="img" aria-labelledby="mapTitle">
            <title id="mapTitle">Classic Diplomacy starting board</title>
          </svg>
        </div>
        <div id="mapOrderControls" class="map-order-controls" aria-label="Map order controls"></div>
      </section>
      <div
        id="paneResizer"
        class="pane-resizer"
        role="separator"
        aria-label="Resize order panel"
        aria-orientation="vertical"
        aria-controls="orderPanel"
        tabindex="0"
      ></div>
      <aside id="orderPanel" class="side-pane" aria-label="Board details">
        <section class="panel">
          <h2>Selected</h2>
          <div id="selection" class="selection"></div>
        </section>
        <section class="panel">
          <h2>Orders</h2>
          <div class="order-actions">
            <button id="submitOrders" class="primary-button" type="button">Submit Orders</button>
            <button id="resetGame" class="secondary-button" type="button">Reset</button>
          </div>
          <div id="orderList" class="order-list"></div>
        </section>
        <section class="panel">
          <h2>Results</h2>
          <div id="resultList" class="result-list"></div>
        </section>
        <section class="panel">
          <h2>Powers</h2>
          <div id="powerList" class="power-list"></div>
        </section>
        <p class="attribution">
          Map: <a href="https://commons.wikimedia.org/wiki/File:Diplomacy.svg">Diplomacy.svg</a> by Martin Asal and contributors, CC BY-SA 3.0.
        </p>
      </aside>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
